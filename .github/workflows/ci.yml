name: CI

# Vérifie à chaque PR que :
# - le générateur de données s'exécute sans erreur
# - le notebook 00-demarrage s'exécute sans erreur
# - le notebook 01-exemple s'exécute sans erreur
# C'est notre garantie qu'une apprenante qui clone le repo aura un environnement fonctionnel.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert

      - name: Run data generator
        run: python scripts/generate_data.py --seed 42 --output data

      - name: Check generated files exist
        run: |
          test -f data/raw/users.csv
          test -f data/raw/organizations.csv
          test -f data/raw/projects.csv
          test -f data/raw/tasks.csv
          test -f data/raw/task_assignments.csv
          test -f data/raw/comments.csv
          test -f data/raw/activity_logs.json
          test -f data/raw/performance_metrics.csv
          test -f data/reference/promos.csv

      - name: Execute demarrage notebook
        run: jupyter nbconvert --to notebook --execute notebooks/00-demarrage.ipynb --output _test.ipynb

      - name: Execute exemple notebook
        run: jupyter nbconvert --to notebook --execute notebooks/01-exemple-exploration.ipynb --output _test.ipynb
